name: Daily German Vocabulary

on:
  schedule:
    # 06:00 UTC ≈ 07:00/08:00 Zurich time (CET/CEST) - adjust to taste.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send today's words
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python send_daily_words.py

      - name: Commit updated progress
        if: always() && steps.send.outcome != 'cancelled'
        run: |
          git config user.name "vocab-bot"
          git config user.email "vocab-bot@users.noreply.github.com"
          git add vocab_b1_de_uk.json telegram_chats.json
          git diff --quiet --cached || git commit -m "Update vocab progress $(date -u +'%Y-%m-%d')"
          git push
